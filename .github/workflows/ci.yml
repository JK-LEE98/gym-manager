name: CI

# PR을 올릴 때만 실행한다.
# 커밋마다 돌리면 Actions 사용량을 낭비하고 피드백도 오히려 늦어진다.
on:
  pull_request:
    branches: [dev, main]

jobs:
  # 코드 검증. 여기서 실행하는 명령은 전부 로컬에서도 그대로 칠 수 있어야 한다.
  # CI에서만 통하는 동작이 있으면 실패했을 때 원인을 찾기 어렵다.
  verify:
    name: Lint · Build · Test
    runs-on: ubuntu-latest

    # E2E 테스트는 실제 DB를 사용한다.
    # 포트를 5433으로 매핑해 로컬 테스트 컨테이너와 동일하게 맞췄다.
    # 덕분에 .env.test 하나를 로컬과 CI가 함께 쓸 수 있다.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gym
          POSTGRES_PASSWORD: gym1234
          POSTGRES_DB: gym_manager_test
        ports:
          - '5433:5432'
        # DB가 준비되기 전에 테스트가 시작되면 연결 실패로 깨진다
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # .nvmrc를 단일 출처로 삼는다. 로컬과 CI의 Node 버전이 어긋나지 않는다
          node-version-file: '.nvmrc'
          cache: npm

      # npm install이 아닌 npm ci를 쓴다.
      # package-lock.json을 그대로 설치하므로 로컬과 완전히 동일한 트리가 만들어진다
      - name: Install dependencies
        run: npm ci

      # --fix가 붙은 `npm run lint`를 쓰면 CI가 에러를 자동으로 고쳐놓고 통과시킨다.
      # 검증이 아니라 수정이 되어버리므로 CI에서는 --fix 없는 스크립트를 쓴다.
      - name: Lint
        run: npm run lint:ci

      - name: Build
        run: npm run build

      - name: Unit test
        run: npm run test

      # .env.test를 커밋해두었으므로 별도 환경변수 주입이 필요 없다
      - name: E2E test
        run: npm run test:e2e

  # 운영 이미지가 빌드 가능한 상태인지 검증한다.
  # 로컬 개발은 컨테이너 밖(watch 모드)에서 하므로, 이미지가 깨진 것을
  # 배포 시점에야 발견하는 상황을 막는다.
  docker:
    name: Docker Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          # GitHub Actions 캐시를 사용해 레이어를 재활용한다
          cache-from: type=gha
          cache-to: type=gha,mode=max
